name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'architecture.html']
  pull_request:
    paths-ignore: ['**.md', 'architecture.html']
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Synthetic regression (57 checks, no real messages sent)
        run: python tests/driver.py
      - name: CLI smoke (--version / --check-updates)
        env:
          PYTHONIOENCODING: utf-8   # Windows runner stdout 默认 cp1252,会炸中文输出
        run: |
          python zcode_resume_watcher.py --version
          python zcode_resume_watcher.py --check-updates
