name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'architecture.html']
  pull_request:
    paths-ignore: ['**.md', 'architecture.html']
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Synthetic regression (99 checks, no real messages sent)
        run: python tests/driver.py
      - name: CLI smoke (--version / --check-updates)
        env:
          PYTHONIOENCODING: utf-8   # Windows runner stdout 默认 cp1252,会炸中文输出
        run: |
          python zcode_resume_watcher.py --version
          python zcode_resume_watcher.py --check-updates
