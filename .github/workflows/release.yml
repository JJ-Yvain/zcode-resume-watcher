name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression gate (must pass before release)
        run: python tests/driver.py
      - name: Package (tracked files only, top-level folder kept)
        run: |
          python -m py_compile zcode_resume_watcher.py
          mkdir -p dist
          git archive --format=zip --prefix=zcode-resume-watcher/ \
            -o "dist/zcode-resume-watcher-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
