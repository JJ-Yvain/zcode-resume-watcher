name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regression gate (must pass before release)
        run: python tests/driver.py
      - name: Package (tracked files only, top-level folder kept)
        run: |
          python -m py_compile zcode_resume_watcher.py
          mkdir -p dist
          git archive --format=zip --prefix=zcode-resume-watcher/ \
            -o "dist/zcode-resume-watcher-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.zip
          generate_release_notes: true
