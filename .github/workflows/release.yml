name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Regression gate (must pass before release)
        run: python tests/driver.py
      - name: Package (tracked files only, top-level folder kept)
        run: |
          python -m py_compile zcode_resume_watcher.py
          mkdir -p dist
          git archive --format=zip --prefix=zcode-resume-watcher/ \
            -o "dist/zcode-resume-watcher-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*.zip
          generate_release_notes: true
